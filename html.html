<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #888;
      }

      /* Khung chính */
      .container {
        width: 900px;
        height: 550px;
        margin: 50px auto;

        background: linear-gradient(
          120deg,
          #eee7f5 0%,
          #c8c4ed 40%,
          #55c9e0 100%
        );

        position: relative;
        overflow: hidden;
      }

      /* Header */
      header {
        height: 70px;
        display: flex;
        align-items: center;
        padding: 0 45px;

        position: relative;
        z-index: 10;
      }

      .logo {
        font-size: 14px;
        font-weight: bold;
        color: #555;
      }

      nav {
        margin-left: 50px;
      }

      nav a {
        text-decoration: none;
        color: #555;
        font-size: 12px;
        margin-right: 25px;
      }

      nav a:hover {
        color: #000;
      }

      .your-logo {
        position: absolute;
        right: 0;
        top: 0;

        width: 120px;
        height: 70px;

        display: flex;
        justify-content: center;
        align-items: center;

        background-color: rgba(80, 75, 170, 0.8);
        color: white;

        border-radius: 0 0 0 60px;

        font-size: 13px;
      }

      /* Nội dung */
      main {
        position: relative;
        height: calc(100% - 70px);
      }

      .content {
        position: absolute;
        left: 100px;
        top: 80px;

        z-index: 5;
      }

      .small-text {
        font-size: 12px;
        color: #777;
        margin-bottom: 8px;
      }

      h1 {
        font-size: 42px;
        line-height: 1.05;
        color: #555;
        margin-bottom: 15px;
      }

      h1 span {
        color: #555;
      }

      .description {
        width: 300px;
        font-size: 13px;
        line-height: 1.6;
        color: #777;
        margin-bottom: 25px;
      }

      /* Button */
      .buttons {
        display: flex;
        gap: 10px;
      }

      button {
        padding: 9px 18px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 11px;
      }

      .btn-light {
        background-color: white;
        color: #555;
        border: 1px solid white;
      }

      .btn-dark {
        background-color: transparent;
        color: #555;
        border: 1px solid #777;
      }

      button:hover {
        transform: translateY(-2px);
      }

      /* Hình tròn */
      .shapes {
        position: absolute;
        right: 50px;
        top: 30px;

        width: 450px;
        height: 400px;
      }

      /* Hình tròn chung */
      .circle {
        position: absolute;
        border-radius: 50%;

        background: linear-gradient(135deg, #72d6e7, #5b9edb);
      }

      /* Hình 1 */
      .circle-1 {
        width: 100px;
        height: 100px;

        top: 60px;
        left: 150px;
      }

      /* Hình 2 */
      .circle-2 {
        width: 70px;
        height: 70px;

        top: 20px;
        left: 240px;
      }

      /* Hình 3 */
      .circle-3 {
        width: 55px;
        height: 55px;

        top: 180px;
        left: 130px;
      }

      /* Hình 4 */
      .circle-4 {
        width: 80px;
        height: 80px;

        top: 130px;
        left: 270px;
      }

      /* Tạo mảng màu cong phía trên */
      .container::before {
        content: "";

        position: absolute;
        top: -150px;
        left: 200px;

        width: 500px;
        height: 250px;

        background-color: rgba(255, 255, 255, 0.75);

        border-radius: 0 0 50% 50%;
      }

      /* Hình cong phía dưới */
      .container::after {
        content: "";

        position: absolute;
        bottom: -180px;
        right: -100px;

        width: 500px;
        height: 300px;

        background-color: rgba(75, 190, 220, 0.35);

        border-radius: 50%;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <header>
        <div class="logo">🌐 My Logo</div>

        <nav>
          <a href="#">Home</a>
          <a href="#">About</a>
          <a href="#">Service</a>
          <a href="#">Contact</a>
        </nav>

        <div class="your-logo">Your Logo</div>
      </header>

      <!-- Nội dung chính -->
      <main>
        <div class="content">
          <p class="small-text">Now Page? Design</p>

          <h1>
            Landing Page<br />
            <span>Design</span>
          </h1>

          <p class="description">
            Create a beautiful and modern landing page for your website.
          </p>

          <div class="buttons">
            <button class="btn-light">View More</button>
            <button class="btn-dark">Get Started</button>
          </div>
        </div>

        <!-- Các hình trang trí -->
        <div class="shapes">
          <div class="circle circle-1"></div>
          <div class="circle circle-2"></div>
          <div class="circle circle-3"></div>
          <div class="circle circle-4"></div>
        </div>
      </main>
    </div>
  </body>
</html>
