<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RikkeiCare — Wireframe Nhắc uống thuốc</title>
    <link rel="stylesheet" href="../css/wireframe.css" />
  </head>
  <body>
    <div class="board">
      <!-- ================= KHUNG 1 ================= -->
      <div class="col">
        <div class="label">KHUNG 1 — Thông báo nhắc thuốc</div>
        <div class="sub">Thông báo vừa hiện lên đúng giờ hẹn</div>
        <div class="frame">
          <div class="header">RikkeiCare — Màn hình chính</div>
          <div class="content">
            <div class="greet">Xin chào, Bác Nguyễn Văn A</div>

            <div class="reminder">
              <div class="r-top">
                <svg
                  width="30"
                  height="30"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#444444"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                  <path d="M13.7 21a2 2 0 0 1-3.4 0" />
                </svg>
                <div class="r-tag">ĐẾN GIỜ UỐNG THUỐC</div>
              </div>
              <div class="r-time">08:00 sáng</div>
              <div class="r-name">Metformin 500mg</div>
              <div class="r-dose">1 viên — uống sau bữa ăn sáng</div>
              <div class="btn">
                <svg
                  width="38"
                  height="38"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#ffffff"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M20 6 9 17l-5-5" />
                </svg>
                <span>ĐÃ UỐNG</span>
              </div>
            </div>

            <div class="appt">
              <div class="appt-title">Lịch khám sắp tới:</div>
              <div class="appt-info">08:00 - 15/09/2026 - BS. Trần B</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
